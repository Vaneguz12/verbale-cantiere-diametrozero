let D = {};

function buildData(){
  D = {
    tipo: answers.tipoVerbale||"",
    numero: answers.numero||"", data: fmtDate(answers.data), ora: answers.ora||"",
    dataFine: fmtDate(answers.dataFine), oraFine: answers.oraFine||"",
    dl: answers.direzioneLavori||"", cse: answers.coordinatoreSicurezza||"",
    professionisti: professionistiPresenti(),
    committente: answers.committente||"", indirizzo: answers.indirizzo||"",
    imprese: imprese.filter(r=>r.nome||r.titolare||r.addetti).map(r=>{ const im=(r.tipo||"impresa")==="impresa"; return {n:nomePresente(r), t:im?(r.titolare||""):"", a:im?(r.addetti||""):""}; }),
    lavorazioni: answers.lavorazioni||"",
    doc: answers.docPresente||"", org: answers.orgRispettata||"", dpi: answers.dpiRispettato||"",
    segnalazioni: answers.segnalazioni||"",
    sospensione: answers.sospensione_on ? (answers.sospensione||"Sì — vedi dettagli") : "",
    ripresa: answers.ripresa_on ? (answers.ripresa||"Sì — vedi dettagli") : "",
    note: answers.noteVarie||"",
    foto: photos.length ? "Sì" : "No",
    photos: photos.slice(),
    mapImg: answers.mapImg||null, mapInclude: answers.mapInclude!==false,
    geoLat: answers.geoLat!=null?answers.geoLat:null, geoLon: answers.geoLon!=null?answers.geoLon:null,
    firmatari: signers.map(sg=>({n:sg.nombre||"", r:sg.rol||"", sig:sg.firma||null}))
  };
  if(D.imprese.length===0) D.imprese=[{n:"",t:"",a:""}];
}
function pdfName(){
  const n = String(D.numero||"").trim() || "__";
  const d = String(D.data||"").trim() || "data";
  return `Verbale di Cantiere Nº ${n} del ${d}.pdf`.replace(/[\\/:*?"<>|]/g,"-");
}
function fmtDate(d){
  if(!d) return "";
  const p = d.split("-");
  return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : d;
}

const CONTACT = "Tel. 0131/350012  ·  Cell. 351/3150938  ·  info@diametrozero.com";
const PW=210, PH=297;

function newDoc(){ const {jsPDF}=window.jspdf; return new jsPDF({unit:"mm",format:"a4"}); }
function footer(doc){
  const n = doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i);
    doc.setFontSize(7.5); doc.setTextColor(150);
    doc.setFont("helvetica","normal");
    doc.text("Diametro Zero — Studio Tecnico  ·  "+CONTACT, 16, PH-9);
    doc.text(`Pag. ${i}/${n}`, PW-16, PH-9, {align:"right"});
  }
}
function fakeSig(doc,x,y,seed){
  // seed qui è l'indice del firmatario; se ha una firma reale, viene disegnata l'immagine
  const f = (D.firmatari && D.firmatari[seed-1]) ? D.firmatari[seed-1] : null;
  if(f && f.sig){
    try{ doc.addImage(f.sig,"PNG",x,y,38,14); return; }catch(e){}
  }
  doc.setDrawColor(200); doc.setLineWidth(0.3);
  doc.line(x,y+11,x+38,y+11);
  doc.setFontSize(6.5); doc.setTextColor(180); doc.setFont("helvetica","normal");
  doc.text("(non firmato)",x,y+14.5);
  doc.setTextColor(0); doc.setLineWidth(0.2);
}

/* ================= STILE B — Report Professionale ================= */
function styleB(){
  const doc=newDoc(); const M=18, W=PW-M*2; let y=0;

  // header bianco con logo
  doc.addImage(LOGO,"PNG",M,12,24,24);
  doc.setTextColor(20); doc.setFont("helvetica","bold"); doc.setFontSize(17);
  doc.text("VERBALE DI CANTIERE",M+32,21);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(85);
  const tipoLines = doc.splitTextToSize(D.tipo||"—", 95).slice(0,3);
  doc.setFontSize(tipoLines.length>1?8:9);
  doc.text(tipoLines,M+32,26.5);
  doc.setFontSize(7.6); doc.setTextColor(140);
  doc.text("DIAMETRO ZERO — STUDIO TECNICO  ·  "+CONTACT,M+32,Math.max(34, 26.5+tipoLines.length*3.8+1.5));
  doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(20);
  doc.text("N° "+(D.numero||"—"),PW-M,21,{align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(95);
  doc.text((D.data||"—")+"  ·  "+(D.ora||"—"),PW-M,27,{align:"right"});
  doc.setDrawColor(25); doc.setLineWidth(0.7); doc.line(M,41,PW-M,41); doc.setLineWidth(0.2);
  y=54;

  function h2(t){
    if(y+14>PH-20){ doc.addPage(); y=M+6; }
    doc.setFillColor(17,19,24); doc.rect(M,y-4,2.4,7,"F");
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(17,19,24);
    doc.text(t.toUpperCase(),M+6,y+1.6);
    y+=9;
  }
  function pair(l,v,x,w){
    doc.setFont("helvetica","normal"); doc.setFontSize(7.2); doc.setTextColor(135);
    doc.text(l.toUpperCase(),x,y);
    doc.setFont("helvetica","bold"); doc.setFontSize(9.2); doc.setTextColor(25);
    const lines=doc.splitTextToSize(v||"—",w);
    doc.text(lines,x,y+4.6);
    return 4.6+lines.length*4.6+4;
  }
  let colW0 = W;
  function twoCol(l1,v1,l2,v2){
    const half=(colW0-8)/2;
    const a=pair(l1,v1,M,half), b=pair(l2,v2,M+half+8,half);
    y+=Math.max(a,b);
  }
  function para(t){
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(50);
    const lines=doc.splitTextToSize(t||"—",W);
    if(y+lines.length*4.8>PH-22){ doc.addPage(); y=M+6; }
    doc.text(lines,M,y); y+=lines.length*4.8+6;
  }

  h2("Anagrafica");
  const hasMap = !!(D.mapImg && D.mapInclude!==false);
  const mapW = 50, mapH = mapW*360/640, mapX = PW-M-mapW, mapY = y-3;
  if(hasMap){
    try{ doc.addImage(D.mapImg,"JPEG",mapX,mapY,mapW,mapH); }catch(e){}
    doc.setDrawColor(190); doc.setLineWidth(0.3); doc.rect(mapX,mapY,mapW,mapH); doc.setLineWidth(0.2);
    doc.setFont("helvetica","normal"); doc.setFontSize(5.8); doc.setTextColor(140);
    doc.text("Ubicazione  ·  © OpenStreetMap contributors",mapX,mapY+mapH+3);
    colW0 = W-mapW-8;
  }
  twoCol("Committente e responsabile dei lavori",D.committente,"Indirizzo cantiere",D.indirizzo);
  twoCol("Direzione Lavori",D.dl,"Coordinatore sicurezza (C.S.P.-C.S.E.)",D.cse);
  colW0 = W;
  if(hasMap) y = Math.max(y, mapY+mapH+7);
  twoCol("Professionisti intervenuti",D.professionisti,"Orario",D.ora+" — "+D.oraFine);
  y+=2;

  h2("Presenti in cantiere");
  doc.setFillColor(243,244,246); doc.rect(M,y-4,W,7,"F");
  doc.setFont("helvetica","bold"); doc.setFontSize(7.4); doc.setTextColor(90);
  doc.text("IMPRESA",M+3,y+0.8); doc.text("TITOLARE / PREPOSTO",M+82,y+0.8); doc.text("ADDETTI",PW-M-3,y+0.8,{align:"right"});
  y+=7;
  D.imprese.forEach((r,i)=>{
    doc.setDrawColor(232); doc.setLineWidth(0.2); doc.line(M,y+4.4,PW-M,y+4.4);
    doc.setFont("helvetica","bold"); doc.setFontSize(8.8); doc.setTextColor(25); doc.text(r.n,M+3,y+1.4);
    doc.setFont("helvetica","normal"); doc.setTextColor(70); doc.text(r.t,M+82,y+1.4);
    doc.setTextColor(25); doc.setFont("helvetica","bold"); doc.text(r.a,PW-M-3,y+1.4,{align:"right"});
    y+=8;
  });
  y+=4;

  h2("Lavorazioni in corso"); para(D.lavorazioni);

  h2("Segnalazioni / azioni correttive"); para(D.segnalazioni);

  function alertBlock(title, body){
    const filled = !!(body && body.trim());
    doc.setFontSize(8.6);
    const ls=doc.splitTextToSize(filled? body : "Nessuna — campo non compilato.", W-12);
    const bh=12+ls.length*4.6;
    if(y+bh>PH-22){ doc.addPage(); y=M+6; }
    if(filled){ doc.setFillColor(254,242,242); doc.setDrawColor(220,38,38); }
    else { doc.setFillColor(249,250,251); doc.setDrawColor(210); }
    doc.setLineWidth(0.4);
    doc.rect(M,y-4,W,bh,"FD");
    filled? doc.setFillColor(220,38,38) : doc.setFillColor(205);
    doc.rect(M,y-4,2.4,bh,"F");
    doc.setFont("helvetica","bold"); doc.setFontSize(8.4);
    filled? doc.setTextColor(185,28,28) : doc.setTextColor(120);
    doc.text(title,M+6,y+1);
    doc.setFont("helvetica","normal"); doc.setFontSize(8.6);
    filled? doc.setTextColor(70) : doc.setTextColor(150);
    doc.text(ls,M+6,y+6.5);
    y+=bh+6; doc.setLineWidth(0.2);
  }
  alertBlock("SOSPENSIONE DEI LAVORI — PERICOLO GRAVE ED IMMINENTE (art. 92 c.1 f, D.Lgs. 81/08)", D.sospensione);
  alertBlock("RIPRESA DEI LAVORI SOSPESI PER PERICOLO GRAVE ED IMMINENTE (art. 92 c.1 f, D.Lgs. 81/08)", D.ripresa);

  h2("Note, varie ed eventuali"); para(D.note);

  h2("Documentazione fotografica");
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(50);
  doc.text("Foto effettuate durante il sopralluogo: "+D.foto+" — allegate in coda al presente verbale.",M,y);
  y+=12;

  h2("Verifiche di conformità");
  const checks=[["Documentazione richiesta in cantiere",D.doc],["Organizzazione del cantiere come indicato",D.org],["Modalità operative ed uso dei DPI",D.dpi]];
  checks.forEach(([l,v])=>{
    if(y+10>PH-22){ doc.addPage(); y=M+6; }
    const ok=v==="Sì";
    ok?doc.setFillColor(22,163,74):doc.setFillColor(220,38,38);
    doc.roundedRect(M,y-3.4,13,6.4,1.4,1.4,"F");
    doc.setTextColor(255); doc.setFont("helvetica","bold"); doc.setFontSize(7.4);
    doc.text(ok?"SÌ":"NO",M+6.5,y+1,{align:"center"});
    doc.setTextColor(35); doc.setFont("helvetica","normal"); doc.setFontSize(9);
    doc.text(l,M+18,y+0.8);
    y+=10;
  });
  y+=2;
  y+=6;

  if(y+80>PH-22){ doc.addPage(); y=M+6; }
  h2("Firme per ricevuta comunicazione");
  const colW=(W-10)/2; let cx=M, row=0;
  D.firmatari.forEach((f,i)=>{
    if(i%2===0 && i>0){ y+=34; cx=M; row++; if(y+34>PH-22){ doc.addPage(); y=M+10; } }
    const x = i%2===0 ? M : M+colW+10;
    fakeSig(doc,x+2,y,i+1);
    doc.setDrawColor(190); doc.setLineWidth(0.3); doc.line(x,y+16,x+colW,y+16);
    doc.setFont("helvetica","bold"); doc.setFontSize(8.8); doc.setTextColor(25);
    doc.text(f.n,x,y+21);
    doc.setFont("helvetica","normal"); doc.setFontSize(7.4); doc.setTextColor(120);
    doc.text(doc.splitTextToSize(f.r,colW),x,y+25.5);
  });
  y+= (D.firmatari.length%2===0? 34 : 34);

  if(y+16>PH-22){ doc.addPage(); y=M+6; }
  doc.setDrawColor(225); doc.line(M,y,PW-M,y); y+=7;
  doc.setFont("helvetica","normal"); doc.setFontSize(8.4); doc.setTextColor(110);
  doc.text("Il sopralluogo si è concluso il "+D.dataFine+" alle ore "+D.oraFine+".",M,y);

  photoPages(doc); footer(doc); return doc;
}

function mapPage(doc){
  if(!D.mapImg || D.mapInclude===false) return;
  doc.addPage();
  const M=16, W=PW-M*2; let y=M;
  doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(20);
  doc.text("UBICAZIONE DEL CANTIERE",M,y+4);
  doc.setDrawColor(25); doc.setLineWidth(0.6); doc.line(M,y+7,PW-M,y+7); doc.setLineWidth(0.2);
  y+=14;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(40);
  const lines = doc.splitTextToSize(D.indirizzo||"—", W);
  doc.text(lines,M,y); y+=lines.length*5+3;
  const h = W*360/640;
  try{ doc.addImage(D.mapImg,"JPEG",M,y,W,h); }catch(e){}
  doc.setDrawColor(190); doc.rect(M,y,W,h);
  y+=h+5;
  doc.setFontSize(7.5); doc.setTextColor(120);
  if(D.geoLat!=null) doc.text("Coordinate: "+Number(D.geoLat).toFixed(5)+", "+Number(D.geoLon).toFixed(5)+"  ·  Mappa © OpenStreetMap contributors",M,y);
}

function photoPages(doc){
  if(!D.photos || !D.photos.length) return;
  const M=16, W=PW-M*2, n=D.photos.length;
  D.photos.forEach((p,i)=>{
    doc.addPage();
    let y=M;
    doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(20);
    doc.text("DOCUMENTAZIONE FOTOGRAFICA",M,y+4);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(110);
    doc.text("Foto "+(i+1)+" di "+n,PW-M,y+4,{align:"right"});
    doc.setDrawColor(25); doc.setLineWidth(0.6); doc.line(M,y+7,PW-M,y+7); doc.setLineWidth(0.2);
    y+=12;
    const note = (p.note||"").trim();
    doc.setFont("helvetica","normal"); doc.setFontSize(10);
    const nl = note ? doc.splitTextToSize(note, W).slice(0,8) : [];
    const noteH = nl.length ? nl.length*4.6+6 : 0;
    const availH = PH-18-y-noteH;
    const pw = p.w||4, ph = p.h||3;
    const k = Math.min(W/pw, availH/ph);
    const w = pw*k, h = ph*k, x = M+(W-w)/2;
    try{ doc.addImage(p.src,"JPEG",x,y,w,h); }catch(e){}
    doc.setDrawColor(215); doc.rect(x,y,w,h);
    if(nl.length){
      doc.setTextColor(40); doc.setFontSize(10);
      doc.text(nl, M, y+h+6);
    }
  });
}

function dataUrlToBase64(dataUrl){
  if(!dataUrl) return null;
  const i = dataUrl.indexOf(",");
  return i>=0 ? dataUrl.slice(i+1) : dataUrl;
}
async function blobToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(dataUrlToBase64(reader.result));
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function saveVerbaleToOdoo(pdfBlob, pdfFilename){
  const cfg = getSettings();
  const pdfBase64 = await blobToBase64(pdfBlob);
  const payload = {
    tipoVerbale: answers.tipoVerbale, numero: answers.numero,
    data: answers.data, ora: answers.ora, dataFine: answers.dataFine, oraFine: answers.oraFine,
    committente: answers.committente, indirizzo: answers.indirizzo,
    direzioneLavori: answers.direzioneLavori, coordinatoreSicurezza: answers.coordinatoreSicurezza,
    professionisti: professionistiPresenti(),
    lavorazioni: answers.lavorazioni,
    docPresente: answers.docPresente, orgRispettata: answers.orgRispettata, dpiRispettato: answers.dpiRispettato,
    segnalazioni: answers.segnalazioni,
    sospensione: answers.sospensione_on ? (answers.sospensione||"Sì") : "",
    ripresa: answers.ripresa_on ? (answers.ripresa||"Sì") : "",
    note: answers.noteVarie,
    imprese: imprese.filter(r=>r.nome||r.titolare).map(r=>({nome:r.nome||"", titolare:r.titolare||"", addetti:r.addetti||""})),
    firmatari: signers.map(sg=>({nome:sg.nombre||"", ruolo:sg.rol||"", firmaBase64: dataUrlToBase64(sg.firma)})),
    foto: photos.map(p=> dataUrlToBase64(p.src)),
    pdfBase64: pdfBase64,
    pdfFilename: pdfFilename
  };
  const res = await fetch(cfg.odooUrl+"/verbale/api/save", {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-Api-Key": cfg.odooKey},
    body: JSON.stringify(payload)
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok || data.error) throw new Error(data.error || ("HTTP "+res.status));
  return data; // {result:"ok", id: ...}
}

async function loadAnagraficaOdoo(){
  const cfg = getSettings();
  if(!cfg.odooUrl || !cfg.odooKey) return;
  try{
    const res = await fetch(cfg.odooUrl+"/verbale/api/anagrafica", {headers:{"X-Api-Key": cfg.odooKey}});
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    sheetAnagrafica.clienti = data.clienti || [];
    sheetAnagrafica.imprese = data.imprese || [];
    sheetAnagrafica.direttori = data.direttori || [];
    sheetAnagrafica.coordinatori = data.coordinatori || [];
    sheetAnagrafica.professionisti = data.professionisti || [];
  }catch(e){
    console.warn("Odoo: non sono riuscito a leggere l'anagrafica.", e);
  }
}
async function loadAnagrafica(){
  const cfg = getSettings();
  if(cfg.odooUrl && cfg.odooKey){ await loadAnagraficaOdoo(); }
  else { await loadAnagraficaSheet(); }
}
function refreshNumeroFromOdoo(){
  const cfg = getSettings();
  if(!cfg.odooUrl || !cfg.odooKey || !answers.committente) return;
  const input = document.getElementById("gf_numero");
  if(!input) return;
  const before = input.value;
  fetch(cfg.odooUrl+"/verbale/api/numero?cliente="+encodeURIComponent(answers.committente), {headers:{"X-Api-Key": cfg.odooKey}})
    .then(r=>r.json())
    .then(d=>{ if(d && d.numero && input.value===before) input.value = String(d.numero); })
    .catch(()=>{});
}

async function deliver(){
  buildData();
  const doc = styleB();
  const blob = doc.output("blob");
  const filename = pdfName();
  const dl = window.claude ? await window.claude.use("downloads") : null;
  if(dl){ try{ await dl.save({filename, data: blob}); return {saved:true, blob, filename}; }catch(e){} }
  return {saved:false, blob, filename};
}

function generatePDF(){
  buildData();
  const cfg = getSettings();
  const usaOdoo = !!(cfg.odooUrl && cfg.odooKey);

  app.innerHTML = `
    <div class="card">
      <div class="final-icon">${ICON_CHECK}</div>
      <div class="final-title">Verbale completato</div>
      <div class="final-sub" id="finalSub">${usaOdoo ? "Salvataggio in Odoo in corso..." : "Il documento è pronto. Puoi scaricarlo o inviarlo direttamente via email."}</div>
      <div id="pdfPreview" style="margin-bottom:14px;"></div>
      <div class="nav-row">
        <button class="btn btn-ghost" style="flex:1;" id="previewBtn">Anteprima</button>
        <button class="btn btn-primary" style="flex:1;" id="downloadBtn">Scarica PDF</button>
      </div>
      <button class="btn btn-ghost btn-icon" style="width:100%;margin-top:10px;" id="emailBtn">${ICON_MAIL}<span>Invia / allega a email</span></button>
      <button class="btn btn-ghost" style="width:100%;margin-top:10px;" id="restartBtn">Nuovo verbale</button>
    </div>`;

  if(usaOdoo){
    const doc = styleB();
    const blob = doc.output("blob");
    const filename = pdfName();
    saveVerbaleToOdoo(blob, filename).then(res=>{
      document.getElementById("finalSub").textContent = "Salvato in Odoo (record #"+res.id+"). Puoi anche scaricarlo o inviarlo via email.";
      loadAnagraficaOdoo(); // aggiorna la cache dei suggerimenti con questo nuovo verbale
    }).catch(err=>{
      document.getElementById("finalSub").textContent = "Il PDF è pronto, ma il salvataggio in Odoo non è riuscito: "+err.message+". Puoi comunque scaricarlo o inviarlo.";
    });
  } else {
    rememberAnagrafica();
  }

  document.getElementById("downloadBtn").addEventListener("click", async ()=>{
    const btn = document.getElementById("downloadBtn");
    btn.textContent = "Preparazione...";
    const res = await deliver();
    if(!res.saved){
      const a=document.createElement("a");
      a.href=URL.createObjectURL(res.blob); a.download=res.filename; a.click();
    }
    btn.textContent = "Scarica PDF";
  });

  document.getElementById("previewBtn").addEventListener("click", ()=>{
    buildData();
    const blob = styleB().output("blob");
    const url = URL.createObjectURL(blob);
    const pv = document.getElementById("pdfPreview");
    pv.innerHTML = `<embed src="${url}#toolbar=0&navpanes=0&view=FitH" type="application/pdf" style="width:100%;height:420px;border:1px solid var(--border);border-radius:10px;background:#fff;display:block;">
      <p class="hint">Se l'anteprima non si vede sul telefono, usa "Scarica PDF".</p>`;
  });

  document.getElementById("emailBtn").addEventListener("click", async ()=>{
    const btn = document.getElementById("emailBtn");
    const label = btn.querySelector("span");
    label.textContent = "Preparazione...";
    buildData();
    const doc = styleB();
    const blob = doc.output("blob");
    const filename = pdfName();
    const file = new File([blob], filename, {type:"application/pdf"});
    let shared = false;
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:"Verbale di Cantiere", text:"Verbale di cantiere — "+(D.indirizzo||"")});
        shared = true;
      }catch(e){ shared = true; }
    }
    if(!shared){
      const a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download=filename; a.click();
      alert("L'invio diretto non è supportato su questo browser. Il PDF è stato scaricato: allegalo manualmente alla tua email.");
    }
    label.textContent = "Invia / allega a email";
  });

  document.getElementById("restartBtn").addEventListener("click", ()=>{
    current=0; for(const k in answers) delete answers[k];
    imprese.length=0; photos.length=0; signers.length=0; professionistiList.length=0;
    render();
  });
}

document.getElementById("gearBtn").addEventListener("click", openSettings);
loadAnagrafica();
loadCapSheet();
render();
})();
